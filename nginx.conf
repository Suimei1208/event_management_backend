user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events { 
    worker_connections 1024;
}

http { 
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream user-services {
        server user-services:5000;
    }

    upstream event-service {
        server event-service:5001;
    }

    upstream ticket-service {
        server ticket-service:5002;
    }

     upstream event-finance-service {
        server event-finance-service:5003;
    }

     upstream document-service {
        server document-service:5004;
    }

    server {
        listen 80;
        server_name localhost;

        location /user-services/{
            proxy_pass http://user-services/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
        }

        location /event-service/ {
            proxy_pass http://event-service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
        }

        location /ticket-service/ {
            proxy_pass http://ticket-service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
        }

        location /event-finance-service/ {
            proxy_pass http://event-finance-service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
        }
        location /document-service/ {
            proxy_pass http://document-service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
        }
    }
}